# Settings relevant for the hitobito_zsv wagon
# Overrides settings from the main application
application:
  name: Zentralverband Schweizer Volkstheater  # set same name in email.sender and email.mass_recipient
  languages:
    de: Deutsch

  logo:
    background_color: "#999999"

  # non UI languages for assigning to person#language
  # additional_languages:
  #   en: Englisch

# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
root_email: hitobito-zsv@puzzle.ch

phone_number:
  custom_label:
    enabled: false

social_account:
  custom_label:
    enabled: false

additional_email:
  custom_label:
    enabled: false

additional_address:
  custom_label:
    enabled: false
